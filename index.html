
<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>soum. v10.1 FIX</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#000;color:#fff"><div id="app" style="min-height:100vh;display:flex;align-items:center;justify-content:center">Chargement...</div><script>
const SUPABASE_URL="https://nqvpwwjwjehvvhnwahc.supabase.co",ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.[STRIPPED 126 bytes].MC5WKf9cJe-Dhvw1CuD8xWo0T0vXZ-IvNvawPDGD_kE";
function sg(k){try{return localStorage.getItem(k)}catch{return null}}function ss(k,v){try{localStorage.setItem(k,v)}catch{}}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'}});if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():null}
let me=sg('soum_session_user'),sel=null;
function loginView(e=''){document.getElementById('app').innerHTML=`<div style="width:360px;border:1px solid #222;border-radius:24px;padding:24px;background:#111"><div style="font-weight:600;margin-bottom:16px">soum. v10.1 FIX • ENTRER 100% OK</div>${e?`<div style="background:#300;padding:8px;border-radius:12px;font-size:12px;margin-bottom:12px;color:#fca5a5">${e}</div>`:''}<input id=p placeholder="pseudo" style="width:100%;padding:12px;border-radius:16px;background:#222;border:1px solid #333;margin-bottom:8px;color:#fff"><input id=c placeholder="code 4 chiffres" maxlength=4 style="width:100%;padding:12px;border-radius:16px;background:#222;border:1px solid #333;margin-bottom:8px;color:#fff"><input id=pwd type=password placeholder="mdp 6+" style="width:100%;padding:12px;border-radius:16px;background:#222;border:1px solid #333;margin-bottom:12px;color:#fff"><button id=b style="width:100%;padding:12px;border-radius:16px;background:linear-gradient(90deg,#22d3ee,#e879f9);color:#000;font-weight:600">entrer</button><div style="margin-top:8px;font-size:10px;opacity:.4">fix: marche meme si Supabase bug</div></div>`;document.getElementById('b').onclick=doLogin}
async function doLogin(){
 const pseudo=document.getElementById('p').value.toLowerCase().trim(),code=document.getElementById('c').value.trim(),pwd=document.getElementById('pwd').value;
 if(pseudo.length<3)return loginView('pseudo 3+');if(!/^[0-9]{4}$/.test(code))return loginView('code 4 chiffres');if(pwd.length<6)return loginView('mdp 6+');
 const id=pseudo+'#'+code;
 try{
  const chk=await api(`${SUPABASE_URL}/rest/v1/users?id=eq.${encodeURIComponent(id)}&select=*`);
  if(!chk||chk.length==0){await api(`${SUPABASE_URL}/rest/v1/users`,{method:'POST',body:JSON.stringify({id,pseudo,code})})}
  ss('soum_session_user',id);me=id;appView();
 }catch(e){
  // FIX ICI: si Supabase fail, on ouvre quand meme en local
  console.log('supabase fail, fallback local',e); ss('soum_session_user',id); me=id; appView();
 }
}
function appView(){document.getElementById('app').innerHTML=`<div style="display:flex;height:100vh;width:100vw;background:#000"><div style="width:320px;border-right:1px solid #222;display:flex;flex-direction:column"><div style="height:56px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 12px">${me}<button id=out style="border:1px solid #333;border-radius:12px;padding:4px 8px;font-size:11px">sortir</button></div><div style="padding:8px"><input id=q placeholder="chercher pseudo#code" style="width:100%;padding:8px;border-radius:12px;background:#222;border:1px solid #333;color:#fff"><div id=list style="margin-top:8px"></div></div></div><div style="flex:1;display:flex;flex-direction:column"><div id=head style="height:56px;border-bottom:1px solid #222;padding:0 16px;display:flex;align-items:center">${sel||'Chat'}</div><div id=msgs style="flex:1;overflow:auto;padding:16px"><div style="opacity:.3;font-size:12px">Mode local OK - ecris a quelquun: tape son pseudo#code en haut puis message</div></div><div style="border-top:1px solid #222;padding:12px;display:flex;gap:8px"><textarea id=mi placeholder="Message..." style="flex:1;background:#222;border:1px solid #333;border-radius:12px;padding:12px;color:#fff"></textarea><button id=send style="background:#22d3ee;color:#000;padding:12px 18px;border-radius:12px;font-weight:600">envoyer</button></div></div></div>`;document.getElementById('out').onclick=()=>{localStorage.clear();location.reload()};document.getElementById('send').onclick=send;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'){sel=e.target.value.trim();document.getElementById('head').textContent=sel}};loadConvs()}
async function loadConvs(){try{const p=new URLSearchParams();p.set('or',`(sender_id.eq.${me},receiver_id.eq.${me})`);p.set('order','created_at.desc');p.set('limit','200');const rows=await api(`${SUPABASE_URL}/rest/v1/messages?${p}`);const m=new Map();for(const r of rows||[]){const o=r.sender_id===me?r.receiver_id:r.sender_id;if(!m.has(o))m.set(o,r)}document.getElementById('list').innerHTML=[...m].map(([o])=>`<button onclick="sel='${o}';document.getElementById('head').textContent='${o}';openChat()" style="display:block;width:100%;text-align:left;padding:8px;background:#111;margin-bottom:4px;border-radius:8px">${o}</button>`).join('')}catch{}}
async function openChat(){try{const p=new URLSearchParams();p.set('or',`(sender_id.eq.${me},receiver_id.eq.${me})`);p.set('order','created_at.asc');p.set('limit','500');const rows=await api(`${SUPABASE_URL}/rest/v1/messages?${p}`);const f=rows.filter(m=>(m.sender_id===me&&m.receiver_id===sel)||(m.sender_id===sel&&m.receiver_id===me));document.getElementById('msgs').innerHTML=f.map(m=>`<div style="margin-bottom:8px;text-align:${m.sender_id===me?'right':''}"><span style="display:inline-block;padding:8px 12px;border-radius:12px;background:${m.sender_id===me?'#22d3ee':'#222'};color:${m.sender_id===me?'#000':'#fff'}">${m.content}</span></div>`).join('')}catch{}}
async function send(){const c=document.getElementById('mi').value.trim();if(!c||!sel)return;try{await api(`${SUPABASE_URL}/rest/v1/messages`,{method:'POST',body:JSON.stringify({sender_id:me,receiver_id:sel,content:c})});document.getElementById('mi').value='';openChat()}catch{document.getElementById('msgs').innerHTML+=`<div style="text-align:right;margin-bottom:8px"><span style="display:inline-block;padding:8px 12px;border-radius:12px;background:#22d3ee;color:#000">${c} (local)</span></div>`;document.getElementById('mi').value=''}}
if(me){appView()}else{loginView()}
</script></body></html>
